<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DevOps Chatbot</title>
    <link rel="icon" type="image/x-icon" href="/public/chat_bot.ico" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font */
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Custom glow animation for the title */
        .glow {
            animation: vibrant-glow 2s ease-in-out infinite alternate;
        }

        @keyframes vibrant-glow {
            from { text-shadow: 0 0 5px rgba(102, 126, 234, 0.7);}
            to { text-shadow: 0 0 15px rgba(102, 126, 234, 0.9), 0 0 25px rgba(102, 126, 234, 0.5); }
        }

        /* Custom scrollbar for a better look */
        #chat-history::-webkit-scrollbar {
            width: 8px;
        }
        #chat-history::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        #chat-history::-webkit-scrollbar-thumb {
            background: #c0c8f0;
            border-radius: 10px;
        }
        #chat-history::-webkit-scrollbar-thumb:hover {
            background: #aab5e8;
        }

    </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-green-100 flex justify-center items-stretch min-h-screen text-gray-800">

    <div class="container w-full max-w-4xl mx-auto p-4 sm:p-6 md:p-8 flex flex-col justify-between h-screen">
        <!-- Header Section -->
        <header class="pb-8 border-b-4 border-indigo-500/20">
             <div class="flex items-center justify-center gap-4 sm:gap-6 flex-wrap">
                <img src="/images/logo_intelliswift.png" alt="Company Logo" class="h-16 w-auto object-contain rounded-lg shadow-md transition-transform duration-300 hover:scale-105">
                <div class="flex items-center gap-3">
                    <img src="/images/logo.png" alt="Chatbot Logo" class="h-10 w-auto rounded-full shadow-lg">
                    <h1 class="glow text-1xl sm:text-4xl font-bold text-indigo-800 tracking-tight" style="font-style: italic;">DevOps Chatbot</h1>
                </div>
            </div>
             <p class="text-center text-gray-600 mt-4 text-lg italic">Your AI-powered assistant for all things DevOps.</p>
        </header>

        <!-- Chat History (hidden initially) -->
        <main id="chat-history" class="flex-1 overflow-y-auto my-6 p-4 bg-white/80 backdrop-blur-sm rounded-2xl shadow-inner border border-gray-200/50 min-h-[200px] h-full hidden">
            <!-- Chat bubbles will be appended here -->
        </main>

        <!-- Spacer to push input to bottom when chat is hidden -->
        <div id="spacer" class="flex-1"></div>

        <!-- Input Area -->
        <footer class="mt-auto">
            <div class="relative">
                <!-- NOTE: No <form> tag! -->
                <textarea id="prompt" placeholder="Ask a question or request a script (e.g., Terraform, Kubernetes, Bash)..." class="w-full h-20 p-4 pr-28 text-base text-gray-700 bg-white rounded-xl shadow-lg border border-gray-300 focus:ring-2 focus:ring-indigo-400 focus:outline-none resize-none transition duration-300"></textarea>
                <button id="send-btn" aria-label="Send message" type="button" class="absolute right-4 bottom-4 bg-indigo-800 text-white font-semibold py-2 px-5 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 transform hover:scale-105 active:scale-100">
                    Send
                </button>
            </div>
            <!-- Clear Chat button (container is hidden initially) -->
            <div id="clear-btn-container" class="text-left mt-3 hidden">
                 <button id="clear-btn" class="bg-red-500 text-white py-1.5 px-4 text-sm rounded-lg shadow-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all duration-300 transform hover:scale-105">Clear Chat</button>
            </div>
        </footer>
    </div>

    <!-- Modal for confirmation -->
    <div id="confirmation-modal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl text-center max-w-sm w-full">
            <p id="modal-text" class="text-lg mb-6">Are you sure you want to clear the chat?</p>
            <div class="flex justify-center gap-4">
                <button id="confirm-yes" class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition">Yes</button>
                <button id="confirm-no" class="bg-gray-300 text-gray-800 px-6 py-2 rounded-lg hover:bg-gray-400 transition">No</button>
            </div>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const promptEl = document.getElementById("prompt");
        const chatHistoryEl = document.getElementById("chat-history");
        const sendBtn = document.getElementById("send-btn");
        const clearBtnContainer = document.getElementById("clear-btn-container");
        const clearBtn = document.getElementById("clear-btn");
        const confirmationModal = document.getElementById("confirmation-modal");
        const confirmYesBtn = document.getElementById("confirm-yes");
        const confirmNoBtn = document.getElementById("confirm-no");
        const spacer = document.getElementById("spacer");

        // --- State ---
        let chatMessages = [];

        // --- Functions ---

        // XSS protection
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Renders the entire chat history from the `chatMessages` array
        function renderChatHistory() {
            chatHistoryEl.innerHTML = ''; // Clear existing content
            chatMessages.forEach(msg => {
                let formattedContent = escapeHTML(msg.content);
                // Basic markdown for bold and code blocks
                formattedContent = formattedContent.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                let bubbleHtml;
                if (msg.role === 'user') {
                    bubbleHtml = `
                        <div class="flex justify-end mb-3">
                            <div class="bg-indigo-900 text-white rounded-l-2xl rounded-tr-2xl p-4 max-w-lg shadow-md">
                                ${formattedContent}
                            </div>
                        </div>
                    `;
                } else { // 'model' or 'bot'
                    bubbleHtml = `
                        <div class="flex justify-start mb-3">
                            <div class="bg-gray-200 text-gray-800 rounded-r-2xl rounded-tl-2xl p-2 w-auto max-w-[90%] shadow-md">
                                <pre class="bg-gray-800 text-white p-3 rounded-lg whitespace-pre-wrap font-mono text-sm">${formattedContent}</pre>
                            </div>
                        </div>
                    `;
                }
                chatHistoryEl.innerHTML += bubbleHtml;
            });
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight; // Scroll to bottom
        }

        // Handles the request sending logic
        async function sendRequest() {
            const prompt = promptEl.value.trim();
            if (!prompt) return;

            // Show chat history and clear button on first message
            if (chatHistoryEl.classList.contains('hidden')) {
                chatHistoryEl.classList.remove('hidden');
                clearBtnContainer.classList.remove('hidden');
                spacer.classList.add('hidden'); // Hide spacer
            }

            // Add user message to state and render
            chatMessages.push({ role: "user", content: prompt });
            renderChatHistory(); // Render the user's message immediately

            // Show loading indicator
            const loadingBubble = `
                <div id="loading-bubble" class="flex justify-start mb-3">
                    <div class="bg-gray-200 text-gray-800 rounded-r-2xl rounded-tl-2xl p-4 max-w-lg shadow-md">
                        <div class="flex items-center gap-2">
                           <div class="w-2 h-2 bg-indigo-400 rounded-full animate-pulse"></div>
                           <div class="w-2 h-2 bg-indigo-400 rounded-full animate-pulse" style="animation-delay: 0.2s;"></div>
                           <div class="w-2 h-2 bg-indigo-400 rounded-full animate-pulse" style="animation-delay: 0.4s;"></div>
                        </div>
                    </div>
                </div>
            `;
            chatHistoryEl.innerHTML += loadingBubble;
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;

            // Disable form
            sendBtn.disabled = true;
            promptEl.disabled = true;
            promptEl.value = ""; // Clear input after sending

            try {
                // Prepare payload
                const payload = {
                    prompt,
                    history: chatMessages.slice(0, -1)
                };
                console.log("[Frontend] Sending to backend:", payload);

                const res = await fetch("/api/devops", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                if (!res.ok) {
                    throw new Error(`Server responded with status: ${res.status}`);
                }

                const result = await res.json();

                if (result.success && result.data.response) {
                    chatMessages.push({ role: "model", content: result.data.response });
                } else {
                    const errorMessage = result.error || "An unknown error occurred.";
                    chatMessages.push({ role: "model", content: `Error: ${errorMessage}` });
                    console.error("[Frontend] API error:", errorMessage);
                }

            } catch (err) {
                const errorMessage = err.message || "Failed to fetch response.";
                chatMessages.push({ role: "model", content: `Error: ${errorMessage}` });
                console.error("[Frontend] Exception caught:", err);
            } finally {
                const loadingEl = document.getElementById('loading-bubble');
                if (loadingEl) loadingEl.remove();

                renderChatHistory();
                promptEl.disabled = false;
                sendBtn.disabled = false;
                promptEl.focus();

                console.log("[Frontend] chatMessages so far:", JSON.parse(JSON.stringify(chatMessages)));
            }
        }

        // --- Event Listeners ---
        sendBtn.addEventListener("click", sendRequest);

        promptEl.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendRequest();
            }
        });

        clearBtn.addEventListener("click", () => {
            confirmationModal.classList.remove('hidden');
        });

        confirmNoBtn.addEventListener("click", () => {
            confirmationModal.classList.add('hidden');
        });

        confirmYesBtn.addEventListener("click", () => {
            chatMessages = [];
            renderChatHistory();

            // Reset to initial state
            chatHistoryEl.classList.add('hidden');
            clearBtnContainer.classList.add('hidden');
            spacer.classList.remove('hidden'); // Show spacer again

            confirmationModal.classList.add('hidden');
            promptEl.focus();
            console.log("[Frontend] Chat cleared.");
        });

    </script>
</body>
</html>
